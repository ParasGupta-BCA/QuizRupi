name: Build and Deploy Flutter Web to Vercel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Build QuizRupi Customer Web App
        run: |
          cd source_code/Quiz_Customers
          flutter pub get
          flutter build web --release --base-href "/"
          cd ../..
          # Sync build to root distribution
          cp -r source_code/Quiz_Customers/build/web/* ./

      - name: Build QuizRupi Admin Web Portal
        run: |
          cd source_code/QuizRupi_Admin
          flutter pub get
          flutter build web --release --base-href "/admin/"
          cd ../..
          # Sync build to admin distribution
          mkdir -p admin
          cp -r source_code/QuizRupi_Admin/build/web/* ./admin/

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        if: env.VERCEL_TOKEN != ''
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
