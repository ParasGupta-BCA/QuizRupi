include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    deprecated_member_use: ignore
    unnecessary_underscores: ignore
    prefer_interpolation_to_compose_strings: ignore
    non_constant_identifier_names: ignore

linter:
  rules:
    avoid_print: false
